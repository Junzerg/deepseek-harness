# Install into the Linux server's Nginx http configuration include directory.
server {
    listen 18765;
    server_name 172.28.236.3;
    root /srv/lingxi-office;

    location = /versions {
        return 302 /versions/;
    }

    location /versions/ {
        index index.html;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ =404;
    }

    location /updates/win-x64/ {
        autoindex off;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
