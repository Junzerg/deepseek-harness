<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灵犀平台 v1.4 · 本地工作智能体平台</title>
<style>
:root{
  --bg:#ffffff; --side:#f7f7f7; --side-hi:#ececec; --panel:#fafafa;
  --line:#e9e9e9; --line2:#dcdcdc; --line3:#c9c9c9;
  --ink:#1a1a1a; --ink2:#4c4c4c; --ink3:#8b8b8b; --ink4:#b3b3b3;
  --brand:#0e9f6e; --brand-d:#087a55; --brand-l:#e9f7f1; --brand-b:#bfe8d6;
  --warn:#c2760b; --warn-l:#fdf6e8; --danger:#d13c3c; --danger-l:#fdf0f0;
  --info:#2563eb; --info-l:#eef3fe;
  --sh1:0 1px 2px rgba(0,0,0,.04);
  --sh2:0 6px 24px rgba(0,0,0,.10);
  --sh3:0 18px 48px rgba(0,0,0,.16);
  --r-s:8px; --r-m:12px; --r-l:18px; --r-xl:26px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:"Microsoft YaHei","PingFang SC","Segoe UI",Arial,sans-serif;
  color:var(--ink); background:var(--bg); font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none;}
button{cursor:pointer;}
a{color:var(--brand-d);text-decoration:none;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#d6d6d6;border-radius:6px;border:2px solid transparent;background-clip:content-box;}
::-webkit-scrollbar-thumb:hover{background:#bcbcbc;background-clip:content-box;}
::-webkit-scrollbar-track{background:transparent;}

/* ============ 应用外壳 ============ */
.app{display:grid;grid-template-columns:236px minmax(0,1fr) 0px;height:100vh;transition:grid-template-columns .18s ease;}
.app.rp-open{grid-template-columns:236px minmax(0,1fr) 336px;}
.app.rp-collapsed{grid-template-columns:0 236px minmax(0,1fr) 0;}

/* ============ 左侧导航栏 ============ */
.nav{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;min-width:0;}
.nav-top{padding:12px 12px 6px;}
.brand{display:flex;align-items:center;gap:8px;padding:2px 6px 8px;}
.brand .mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--brand),#0b7d56);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;flex:none;}
.brand .txt b{display:block;font-size:13.5px;line-height:1.25;letter-spacing:.2px;}
.brand .txt span{display:block;font-size:10.5px;color:var(--ink3);line-height:1.2;}
.btn-ghost{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:6px 10px;border:1px solid var(--line2);border-radius:var(--r-s);background:#fff;color:var(--ink2);font-size:12.5px;cursor:pointer;box-shadow:var(--sh1);}
.btn-ghost:hover{border-color:var(--line3);color:var(--ink);}
.nav-scroll{flex:1;overflow-y:auto;padding:2px 8px 10px;}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:var(--r-s);color:var(--ink2);font-size:13.5px;cursor:pointer;width:100%;text-align:left;position:relative;}
.nav-item:hover{background:var(--side-hi);}
.nav-item.on{background:#e4e4e4;color:var(--ink);font-weight:600;}
.nav-item .ic{width:17px;height:17px;flex:none;color:var(--ink2);}
.nav-item.on .ic{color:var(--ink);}
.nav-item .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nav-item .tag{font-size:10px;color:var(--ink3);border:1px solid var(--line2);border-radius:5px;padding:0 4px;line-height:15px;flex:none;}
.nav-item .grow{flex:1;}
.nav-group-lbl{font-size:11px;color:var(--ink3);padding:14px 10px 5px;display:flex;align-items:center;justify-content:space-between;}
.nav-group-lbl .cnt{font-size:11px;color:var(--ink4);}
.nav-task{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:var(--r-s);cursor:pointer;font-size:12.5px;color:var(--ink2);}
.nav-task:hover{background:var(--side-hi);}
.nav-task.on{background:#e4e4e4;color:var(--ink);font-weight:600;}
.nav-task .tt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nav-task .tm{font-size:10.5px;color:var(--ink4);flex:none;}
.nav-space{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:var(--r-s);cursor:pointer;font-size:12.5px;color:var(--ink2);}
.nav-space:hover{background:var(--side-hi);}
.nav-space .tt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.st-dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--ink4);}
.st-dot.run{background:#2563eb;animation:pulse 1.4s infinite;}
.st-dot.done{background:var(--brand);}
.st-dot.unread{background:#8b5cf6;}
.st-dot.fail{background:var(--danger);}
.st-dot.wait{background:var(--warn);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}
.nav-foot{border-top:1px solid var(--line);padding:8px 10px;display:flex;align-items:center;gap:4px;}
.nav-foot .ic-btn{width:30px;height:30px;border-radius:var(--r-s);display:flex;align-items:center;justify-content:center;color:var(--ink2);cursor:pointer;}
.nav-foot .ic-btn:hover{background:var(--side-hi);}
.nav-foot .sp{flex:1;}
.avatar{width:26px;height:26px;border-radius:50%;background:#dfe7e4;color:var(--brand-d);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;cursor:pointer;flex:none;}
.avatar.lg{width:34px;height:34px;font-size:13px;}

/* ============ 主区 ============ */
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden;background:var(--bg);}
.topbar{height:46px;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--line);flex:none;background:#fff;position:relative;z-index:6;}
.topbar .tbtn{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:var(--r-s);color:var(--ink2);font-size:12.5px;cursor:pointer;}
.topbar .tbtn:hover{background:var(--side-hi);}
.topbar .sp{flex:1;}
.topbar .title{font-size:13px;color:var(--ink2);font-weight:600;max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.views{flex:1;overflow:hidden;position:relative;}
.view{position:absolute;inset:0;overflow-y:auto;display:none;}
.view.on{display:block;}

/* ============ 首页 ============ */
.home{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:56px 24px 40px;}
.hero{text-align:center;}
.hero h1{font-size:32px;font-weight:700;letter-spacing:.5px;}
.hero .sub{color:var(--ink3);font-size:13px;margin-top:6px;}
.seg{display:inline-flex;background:#f0f0f0;border-radius:var(--r-l);padding:4px;margin:22px 0 20px;gap:2px;}
.seg button{padding:7px 18px;border-radius:20px;font-size:13.5px;color:var(--ink2);display:flex;align-items:center;gap:6px;}
.seg button.on{background:#1f1f1f;color:#fff;font-weight:600;}
.scene-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:18px;max-width:760px;}
.chip{display:flex;align-items:center;gap:6px;padding:7px 14px;border:1px solid var(--line2);border-radius:var(--r-l);background:#fff;font-size:13px;color:var(--ink2);cursor:pointer;position:relative;}
.chip:hover{border-color:var(--ink4);}
.chip.on{background:#f2f2f2;border-color:var(--line3);color:var(--ink);}
.chip .ic{width:15px;height:15px;}
.chip .tip{position:absolute;left:0;top:calc(100% + 8px);background:#fff;border:1px solid var(--line2);border-radius:var(--r-m);box-shadow:var(--sh2);padding:10px 12px;width:340px;font-size:12.5px;color:var(--ink2);display:none;z-index:30;line-height:1.6;}
.chip:hover .tip{display:block;}

/* ============ 输入区 ============ */
.composer-wrap{width:100%;max-width:780px;margin-top:4px;}
.composer{background:#fff;border:1px solid var(--line2);border-radius:var(--r-l);box-shadow:0 2px 10px rgba(0,0,0,.05);padding:12px 14px 8px;transition:border-color .15s,box-shadow .15s;}
.composer:focus-within{border-color:var(--brand);box-shadow:0 4px 18px rgba(14,159,110,.12);}
.cm-text{width:100%;min-height:46px;max-height:220px;overflow-y:auto;resize:none;font-size:14.5px;line-height:1.65;color:var(--ink);white-space:pre-wrap;}
.cm-text:empty:before{content:attr(data-ph);color:var(--ink4);}
.cm-bar{display:flex;align-items:center;gap:8px;margin-top:6px;}
.cm-bar .sp{flex:1;}
.icon-btn{width:28px;height:28px;border-radius:var(--r-s);display:flex;align-items:center;justify-content:center;color:var(--ink2);cursor:pointer;}
.icon-btn:hover{background:var(--side-hi);}
.send-btn{width:30px;height:30px;border-radius:50%;background:#1f1f1f;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}
.send-btn:disabled{background:#d8d8d8;cursor:not-allowed;}
.attach-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.attach{display:flex;align-items:center;gap:7px;border:1px solid var(--line2);border-radius:var(--r-s);padding:5px 8px;font-size:12px;background:var(--panel);max-width:260px;}
.attach .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.attach .x{color:var(--ink3);cursor:pointer;display:flex;}
.attach .x:hover{color:var(--danger);}
.collapsed-paste{display:flex;align-items:center;gap:8px;border:1px dashed var(--line2);background:var(--panel);border-radius:var(--r-s);padding:6px 9px;font-size:12px;color:var(--ink2);max-width:100%;cursor:pointer;}
.collapsed-paste:hover{border-color:var(--ink4);}
.collapsed-paste .txt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink3);}
.cm-tools{display:flex;align-items:center;gap:14px;margin-top:10px;font-size:12.5px;color:var(--ink2);flex-wrap:wrap;}
.cm-tools .tool{display:flex;align-items:center;gap:6px;cursor:pointer;padding:3px 6px;border-radius:6px;}
.cm-tools .tool:hover{background:var(--side-hi);}
.mode-chip{display:inline-flex;align-items:center;gap:6px;background:var(--info-l);color:#1d4ed8;border:1px solid #cfddfb;border-radius:20px;padding:3px 10px;font-size:12px;}
.mode-chip.ask{background:var(--warn-l);color:var(--warn);border-color:#f0e2c4;}
.mode-chip .x{cursor:pointer;display:flex;opacity:.7;}
.mode-chip .x:hover{opacity:1;}

/* ============ 弹出菜单 ============ */
.pop{position:absolute;background:#fff;border:1px solid var(--line2);border-radius:var(--r-m);box-shadow:var(--sh2);padding:6px;z-index:60;min-width:190px;animation:pop .12s ease;}
@keyframes pop{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
.pop-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:var(--r-s);font-size:13px;color:var(--ink);cursor:pointer;width:100%;text-align:left;}
.pop-item:hover{background:var(--side-hi);}
.pop-item .ic{width:16px;height:16px;color:var(--ink2);flex:none;}
.pop-item .grow{flex:1;}
.pop-item .sub{color:var(--ink4);font-size:11px;}
.pop-item .ic-r{margin-left:auto;color:var(--ink4);display:flex;}
.pop-sep{height:1px;background:var(--line);margin:5px 0;}
.pop-label{font-size:11px;color:var(--ink3);padding:6px 10px 3px;}
.pop-note{font-size:11.5px;color:var(--ink3);line-height:1.55;padding:2px 10px 8px;}
.switch{margin-left:auto;width:34px;height:19px;border-radius:12px;background:#dcdcdc;position:relative;flex:none;transition:background .15s;}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s;}
.switch.on{background:var(--brand);}
.switch.on::after{transform:translateX(15px);}

/* ============ 对话页 ============ */
.chat{display:flex;flex-direction:column;height:100%;}
.chat-scroll{flex:1;overflow-y:auto;padding:22px 0 20px;}
.chat-inner{max-width:820px;margin:0 auto;padding:0 24px;display:flex;flex-direction:column;gap:16px;}
.msg-user{align-self:flex-end;max-width:78%;background:#f2f2f2;border-radius:14px 14px 4px 14px;padding:9px 13px;font-size:14px;white-space:pre-wrap;}
.msg-ai{align-self:flex-start;max-width:92%;width:100%;}
.ai-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.ai-av{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--brand),#0b7d56);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none;}
.ai-name{font-size:12.5px;color:var(--ink2);font-weight:600;}
.ai-time{margin-left:auto;font-size:11px;color:var(--ink4);}
.ai-body{font-size:14px;line-height:1.75;color:var(--ink);white-space:pre-wrap;}
.ai-body .hl{background:#fff6d6;border-radius:3px;padding:0 2px;}
.think-box{margin:8px 0;border:1px solid var(--line);border-radius:var(--r-m);background:var(--panel);overflow:hidden;}
.think-hd{display:flex;align-items:center;gap:8px;padding:8px 11px;font-size:12.5px;color:var(--ink2);cursor:pointer;}
.think-hd:hover{background:#f3f3f3;}
.think-hd .grow{flex:1;}
.think-hd .sp{width:14px;height:14px;color:var(--ink4);transition:transform .15s;display:flex;}
.think-box.open .think-hd .sp{transform:rotate(90deg);}
.think-bd{padding:2px 12px 11px;font-size:12.5px;color:var(--ink3);line-height:1.7;display:none;white-space:pre-wrap;}
.think-box.open .think-bd{display:block;}
.tool-card{margin:8px 0;border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;background:#fff;}
.tool-hd{display:flex;align-items:center;gap:9px;padding:8px 11px;font-size:12.5px;cursor:pointer;}
.tool-hd:hover{background:var(--panel);}
.tool-hd .ic{width:15px;height:15px;color:var(--brand);flex:none;}
.tool-hd .nm{font-weight:600;color:var(--ink);}
.tool-hd .st{color:var(--ink3);font-size:11.5px;}
.tool-hd .grow{flex:1;}
.tool-hd .sp{width:13px;height:13px;color:var(--ink4);display:flex;transition:transform .15s;}
.tool-card.open .tool-hd .sp{transform:rotate(90deg);}
.tool-bd{display:none;padding:0 11px 10px;font-size:12px;color:var(--ink3);line-height:1.7;}
.tool-card.open .tool-bd{display:block;}
.tool-bd .mono{font-family:Consolas,monospace;font-size:11.5px;background:#f4f6f5;border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin-top:6px;white-space:pre-wrap;overflow-x:auto;color:#3c4a45;}
.artifact-card{margin:8px 0;border:1px solid var(--line2);border-radius:var(--r-m);padding:11px 13px;display:flex;align-items:center;gap:11px;background:#fff;cursor:pointer;max-width:520px;}
.artifact-card:hover{border-color:var(--brand);box-shadow:0 2px 12px rgba(14,159,110,.10);}
.artifact-card .fi{width:34px;height:40px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;color:#fff;flex:none;letter-spacing:.3px;}
.fi-xlsx{background:#1d6f42;} .fi-docx{background:#2b579a;} .fi-pptx{background:#c43e1c;} .fi-pdf{background:#b3392f;} .fi-html{background:#b7791f;} .fi-img{background:#6b7280;} .fi-md{background:#475569;} .fi-csv{background:#217346;} .fi-yaml{background:#a16207;}
.artifact-card .meta{flex:1;min-width:0;}
.artifact-card .meta b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.artifact-card .meta span{font-size:11.5px;color:var(--ink3);}
.artifact-card .acts{display:flex;gap:4px;flex:none;}
.plan-panel{margin:8px 0;border:1px solid #cfddfb;border-radius:var(--r-m);background:var(--info-l);overflow:hidden;}
.plan-hd{display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:12.5px;font-weight:700;color:#1d4ed8;}
.plan-bd{padding:0 12px 11px;font-size:12.5px;color:#33415c;line-height:1.8;}
.plan-bd ol{margin:4px 0 0 18px;}
.plan-bd li{margin:3px 0;}
.plan-acts{display:flex;gap:8px;padding:0 12px 12px;}
.btn{padding:6px 14px;border-radius:var(--r-s);font-size:12.5px;border:1px solid var(--line2);background:#fff;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn:hover{border-color:var(--ink4);}
.btn.primary{background:#1f1f1f;color:#fff;border-color:#1f1f1f;font-weight:600;}
.btn.primary:hover{background:#333;}
.btn.brand{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600;}
.btn.brand:hover{background:var(--brand-d);}
.btn.danger{color:var(--danger);border-color:#f0c8c8;}
.btn.danger:hover{background:var(--danger-l);}
.btn.sm{padding:3px 9px;font-size:11.5px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.connector-card{margin:8px 0;border:1px solid #e8dcc0;background:var(--warn-l);border-radius:var(--r-m);padding:10px 12px;display:flex;align-items:center;gap:10px;}
.connector-card .av{width:28px;height:28px;border-radius:8px;background:#fff;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none;}
.connector-card .meta{flex:1;}
.connector-card .meta b{display:block;font-size:12.5px;}
.connector-card .meta span{font-size:11.5px;color:var(--ink3);}
.composer-dock{border-top:1px solid var(--line);background:#fff;padding:12px 24px 14px;flex:none;}
.composer-dock .composer-wrap{max-width:820px;margin:0 auto;}

/* ============ 右侧面板 ============ */
.rpanel{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;overflow:hidden;min-width:0;}
.rp-tabs{display:flex;align-items:center;gap:2px;padding:7px 8px;border-bottom:1px solid var(--line);flex:none;background:#fff;}
.rp-tab{padding:5px 10px;border-radius:var(--r-s);font-size:12.5px;color:var(--ink2);cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;}
.rp-tab:hover{background:var(--side-hi);}
.rp-tab.on{background:#e8e8e8;color:var(--ink);font-weight:600;}
.rp-tab .ic{width:14px;height:14px;}
.rp-tabs .sp{flex:1;}
.rp-body{flex:1;overflow-y:auto;padding:12px;}
.rp-empty{padding:40px 16px;text-align:center;color:var(--ink3);font-size:12.5px;}
.rp-empty .ic{width:30px;height:30px;color:var(--ink4);margin:0 auto 10px;display:block;}
.rp-sec{margin-bottom:16px;}
.rp-sec h4{font-size:11.5px;color:var(--ink3);font-weight:600;margin-bottom:7px;display:flex;align-items:center;justify-content:space-between;}
.file-row{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:var(--r-s);cursor:pointer;font-size:12.5px;}
.file-row:hover{background:#f0f0f0;}
.file-row .fi{width:24px;height:28px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;flex:none;}
.file-row .meta{flex:1;min-width:0;}
.file-row .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;}
.file-row .meta span{font-size:10.5px;color:var(--ink4);}
.diff-line{display:flex;gap:8px;font-size:11.5px;font-family:Consolas,monospace;padding:1px 6px;border-radius:3px;}
.diff-line.add{background:#e7f6ec;color:#136a3b;}
.diff-line.del{background:#fdecec;color:#a02020;}
.diff-line.ctx{color:var(--ink3);}
.term-line{font-family:Consolas,monospace;font-size:11.5px;color:#cfe3d8;white-space:pre-wrap;line-height:1.7;}
.term-line .p{color:#6ee7b7;}
.term-line .e{color:#fca5a5;}

/* ============ 通用页面 ============ */
.page{max-width:1180px;margin:0 auto;padding:26px 28px 60px;}
.page h2{font-size:20px;font-weight:700;margin-bottom:4px;}
.page .desc{color:var(--ink3);font-size:12.5px;margin-bottom:18px;}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;}
.tabs button{padding:8px 16px;font-size:13.5px;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
.tabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--brand);}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px;}
.card{border:1px solid var(--line2);border-radius:var(--r-m);background:#fff;padding:13px 15px;cursor:pointer;transition:border-color .15s,box-shadow .15s;}
.card:hover{border-color:var(--brand);box-shadow:0 3px 14px rgba(14,159,110,.10);}
.card .ch{display:flex;align-items:center;gap:9px;margin-bottom:7px;}
.card .ci{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;flex:none;}
.card .ch b{font-size:13.5px;flex:1;}
.card .ch .meta{font-size:11px;color:var(--ink3);}
.card .cd{font-size:12px;color:var(--ink3);line-height:1.65;min-height:38px;}
.card .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px;}
.tag-s{font-size:10.5px;color:var(--ink3);background:#f2f2f2;border-radius:4px;padding:1px 6px;}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.bar .sp{flex:1;}
.inp{border:1px solid var(--line2);border-radius:var(--r-s);padding:6px 10px;font-size:12.5px;background:#fff;min-width:150px;}
.inp:focus{border-color:var(--brand);}
.sel{border:1px solid var(--line2);border-radius:var(--r-s);padding:6px 8px;font-size:12.5px;background:#fff;cursor:pointer;}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff;border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;}
.tbl th{background:#f4f4f4;text-align:left;padding:8px 11px;font-weight:600;color:var(--ink2);border-bottom:1px solid var(--line);font-size:11.5px;}
.tbl td{padding:8px 11px;border-bottom:1px solid var(--line);color:var(--ink2);}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover td{background:var(--panel);}
.list-panel{border:1px solid var(--line);border-radius:var(--r-m);background:#fff;overflow:hidden;}
.lp-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);}
.lp-row:last-child{border-bottom:none;}
.lp-row .ic{width:32px;height:32px;border-radius:9px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:none;}
.lp-row .meta{flex:1;min-width:0;}
.lp-row .meta b{display:block;font-size:13px;}
.lp-row .meta span{font-size:11.5px;color:var(--ink3);}
.lp-row .rt{display:flex;align-items:center;gap:8px;flex:none;}
.badge{font-size:10.5px;border-radius:4px;padding:1px 6px;border:1px solid var(--line2);color:var(--ink3);background:#fafafa;}
.badge.brand{color:var(--brand-d);background:var(--brand-l);border-color:var(--brand-b);}
.badge.warn{color:var(--warn);background:var(--warn-l);border-color:#f0e2c4;}
.badge.danger{color:var(--danger);background:var(--danger-l);border-color:#f3cfcf;}
.badge.info{color:#1d4ed8;background:var(--info-l);border-color:#cfddfb;}
.badge.gray{color:var(--ink3);}
.switch-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);}
.switch-row:last-child{border-bottom:none;}
.switch-row .meta{flex:1;}
.switch-row .meta b{display:block;font-size:13px;}
.switch-row .meta span{font-size:11.5px;color:var(--ink3);line-height:1.6;}

/* ============ 弹窗 ============ */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:80;display:flex;align-items:center;justify-content:center;animation:fade .14s ease;padding:24px;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
.modal{background:#fff;border-radius:var(--r-l);box-shadow:var(--sh3);width:560px;max-width:100%;max-height:86vh;overflow:hidden;display:flex;flex-direction:column;animation:up .16s ease;}
@keyframes up{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
.modal-hd{padding:16px 20px 12px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px;}
.modal-hd h3{font-size:15px;font-weight:700;flex:1;}
.modal-hd .x{color:var(--ink3);cursor:pointer;display:flex;padding:2px;}
.modal-hd .x:hover{color:var(--ink);}
.modal-bd{padding:16px 20px;overflow-y:auto;font-size:13px;color:var(--ink2);line-height:1.75;}
.modal-ft{padding:12px 20px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;}
.modal .warnbox{background:var(--danger-l);border:1px solid #f3cfcf;border-radius:var(--r-m);padding:11px 13px;margin-top:12px;font-size:12.5px;color:#8f2626;line-height:1.7;}
.modal .checkline{display:flex;align-items:flex-start;gap:8px;margin-top:12px;font-size:12.5px;color:var(--ink2);cursor:pointer;}
.modal .checkline .box{width:15px;height:15px;border:1px solid var(--line3);border-radius:3px;flex:none;margin-top:2px;display:flex;align-items:center;justify-content:center;color:#fff;}
.modal .checkline.on .box{background:var(--danger);border-color:var(--danger);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--ink2);margin-bottom:5px;font-weight:600;}
.field .hint{font-size:11px;color:var(--ink3);margin-top:4px;}
.field input[type=text],.field textarea,.field select{width:100%;border:1px solid var(--line2);border-radius:var(--r-s);padding:8px 10px;font-size:13px;background:#fff;}
.field textarea{min-height:88px;resize:vertical;line-height:1.6;}
.field input:focus,.field textarea:focus{border-color:var(--brand);}
.picklist{border:1px solid var(--line2);border-radius:var(--r-m);max-height:260px;overflow-y:auto;}
.pick{display:flex;align-items:center;gap:10px;padding:9px 11px;border-bottom:1px solid var(--line);cursor:pointer;}
.pick:last-child{border-bottom:none;}
.pick:hover{background:var(--panel);}
.pick.on{background:var(--brand-l);}
.pick .ci{width:28px;height:28px;border-radius:8px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--ink2);flex:none;}
.pick .meta{flex:1;min-width:0;}
.pick .meta b{display:block;font-size:12.5px;}
.pick .meta span{font-size:11px;color:var(--ink3);}
.picklist + .hint{margin-top:6px;}

/* ============ 拖拽层 ============ */
.dropzone{position:fixed;inset:0;background:rgba(14,159,110,.10);border:3px dashed var(--brand);z-index:90;display:none;align-items:center;justify-content:center;font-size:16px;color:var(--brand-d);font-weight:700;}
.dropzone.on{display:flex;}

/* ============ 全局搜索 ============ */
.search-wrap{position:absolute;inset:0;background:rgba(0,0,0,.28);z-index:70;display:none;align-items:flex-start;justify-content:center;padding-top:9vh;}
.search-wrap.on{display:flex;}
.search-box{width:640px;max-width:92vw;background:#fff;border-radius:var(--r-l);box-shadow:var(--sh3);overflow:hidden;animation:up .16s ease;}
.search-in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);}
.search-in input{flex:1;font-size:15px;}
.search-in .ic{width:17px;height:17px;color:var(--ink3);flex:none;}
.search-res{max-height:56vh;overflow-y:auto;padding:8px;}
.sr-group{font-size:11px;color:var(--ink3);padding:8px 10px 4px;}
.sr-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-s);cursor:pointer;font-size:13px;}
.sr-item:hover{background:var(--side-hi);}
.sr-item .meta{flex:1;min-width:0;}
.sr-item .meta b{display:block;font-size:13px;}
.sr-item .meta span{font-size:11px;color:var(--ink3);}
mark{background:#fff2a8;border-radius:2px;padding:0 1px;}
.search-foot{border-top:1px solid var(--line);padding:8px 16px;font-size:11px;color:var(--ink4);display:flex;gap:14px;}

/* ============ Toast ============ */
.toasts{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{background:#262626;color:#fff;border-radius:var(--r-s);padding:8px 15px;font-size:12.5px;box-shadow:var(--sh2);animation:up .16s ease;display:flex;align-items:center;gap:7px;}
.toast.err{background:#b8302f;}
.toast.ok{background:#0e7d55;}

/* ============ 拖拽排序面板 ============ */
.drag-row{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--line2);border-radius:var(--r-s);background:#fff;margin-bottom:7px;cursor:grab;}
.drag-row.dragging{opacity:.45;}
.drag-row.over{border-color:var(--brand);background:var(--brand-l);}
.drag-row .hd{color:var(--ink4);display:flex;cursor:grab;}
.drag-row .nm{flex:1;font-size:12.5px;}
.drag-row .grp{font-size:11px;color:var(--ink3);background:#f2f2f2;border-radius:4px;padding:1px 6px;}
.drag-panel{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.drag-panel h5{font-size:12px;color:var(--ink2);margin-bottom:8px;}
.drag-note{font-size:11.5px;color:var(--ink3);line-height:1.7;margin-top:4px;}

/* ============ 其他 ============ */
.chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
.pill{display:inline-block;font-size:11.5px;color:var(--ink2);background:#f2f2f2;border-radius:12px;padding:2px 10px;}
.search-foot .sscope{font-size:11px;color:var(--ink4);cursor:pointer;padding:2px 7px;border-radius:5px;}
.search-foot .sscope:hover{background:#f2f2f2;color:var(--ink2);}
.search-foot .sscope.on{background:var(--brand-l);color:var(--brand-d);font-weight:600;}
.drag-list{min-height:60px;border:1px dashed var(--line2);border-radius:var(--r-m);padding:8px;background:var(--panel);}
.drag-row.locked{opacity:.55;cursor:not-allowed;}
.hr{height:1px;background:var(--line);margin:14px 0;}
.muted{color:var(--ink3);}
.small{font-size:11.5px;}
.flex{display:flex;align-items:center;gap:8px;}
.kv{display:flex;gap:10px;font-size:12.5px;padding:4px 0;}
.kv .k{color:var(--ink3);width:104px;flex:none;}
.kv .v{flex:1;color:var(--ink);}
.timeline{position:relative;padding-left:20px;}
.timeline:before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:1px;background:var(--line2);}
.tl-item{position:relative;padding:0 0 14px;}
.tl-item:before{content:"";position:absolute;left:-19px;top:6px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--brand);}
.tl-item .t{font-size:12.5px;font-weight:600;}
.tl-item .d{font-size:11.5px;color:var(--ink3);}
.spin{animation:sp 1s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
.blink{animation:bl 1.1s ease-in-out infinite;}
@keyframes bl{0%,100%{opacity:1;}50%{opacity:.35;}}
@media (max-width:1180px){ .app.rp-open{grid-template-columns:236px minmax(0,1fr) 0px;} .app.rp-open .rpanel{position:absolute;right:0;top:0;bottom:0;width:336px;z-index:40;box-shadow:var(--sh2);} }
/* ============ 设置中心 / 用户菜单 / 深色主题 ============ */
body.dark{
  --bg:#16181d; --side:#1d2026; --side-hi:#262a32; --panel:#20232a;
  --line:#2c3038; --line2:#3a3f48; --line3:#4a505a;
  --ink:#e8eaed; --ink2:#b6bac2; --ink3:#82878f; --ink4:#5a5f68;
  --brand-l:#12352a; --brand-b:#1d5c42;
  --warn-l:#3a2d12; --danger-l:#3a1a1a; --info-l:#14243f;
  --sh2:0 6px 24px rgba(0,0,0,.5); --sh3:0 18px 48px rgba(0,0,0,.6);
}
body.dark .modal{background:#20232a;}
body.dark .pop{background:#262a32;}
body.dark .artifact-card,body.dark .plan-panel{background:#24272e;}
body.dark .tool-bd .mono{background:#191c21;color:#9fb8ad;}
body.dark ::-webkit-scrollbar-thumb{background:#3a3f48;}
.set-wrap{display:flex;width:100%;min-height:420px;}
.set-tabs{width:150px;border-right:1px solid var(--line);padding:6px;flex:none;}
.set-tab{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;font-size:12.5px;color:var(--ink2);cursor:pointer;margin-bottom:2px;}
.set-tab:hover{background:var(--side-hi);}
.set-tab.on{background:var(--brand-l);color:var(--brand-d);font-weight:600;}
.set-main{flex:1;min-width:0;display:flex;flex-direction:column;}
.set-search{margin:12px 16px 0;position:relative;flex:none;}
.set-search input{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 10px 7px 30px;font-size:12.5px;background:var(--panel);color:var(--ink);}
.set-search .sic{position:absolute;left:9px;top:7px;color:var(--ink3);display:flex;}
.set-body{flex:1;overflow-y:auto;padding:4px 16px 14px;max-height:470px;}
.set-sec{margin-top:10px;}
.set-sec>h4{font-size:11px;color:var(--ink3);font-weight:600;letter-spacing:.5px;margin-bottom:2px;text-transform:uppercase;}
.set-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
.set-row:last-child{border-bottom:none;}
.set-row .meta{flex:1;min-width:0;}
.set-row .meta b{display:block;font-size:12.5px;font-weight:600;}
.set-row .meta span{font-size:11px;color:var(--ink3);line-height:1.5;}
.set-row .switch{cursor:pointer;}
.set-row.dim{opacity:.45;}
.set-select{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;}
.set-select .pill{cursor:pointer;border:1px solid transparent;}
.set-select .pill.on{background:var(--brand-l);color:var(--brand-d);border-color:var(--brand-b);font-weight:600;}
.set-btn{font-size:11.5px;border:1px solid var(--line2);border-radius:7px;padding:4px 10px;color:var(--ink2);cursor:pointer;flex:none;white-space:nowrap;}
.set-btn:hover{border-color:var(--brand);color:var(--brand-d);}
.set-btn.warn{border-color:var(--danger);color:var(--danger);}
kbd{display:inline-block;font-family:Consolas,monospace;font-size:10.5px;background:var(--side-hi);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--ink2);}
.set-note{font-size:11px;color:var(--ink3);background:var(--panel);border-radius:8px;padding:8px 10px;line-height:1.7;margin-top:8px;}
.user-head{display:flex;align-items:center;gap:10px;padding:9px 11px;border-bottom:1px solid var(--line);margin-bottom:4px;min-width:210px;}
.user-head .meta{flex:1;}
.user-head .meta b{display:block;font-size:13px;}
.user-head .meta span{font-size:11px;color:var(--ink3);}
/* ============ 资料库（双栏知识库） ============ */
.lib-wrap{display:grid;grid-template-columns:226px minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;background:#fff;min-height:600px;}
.lib-wrap.side-off{grid-template-columns:minmax(0,1fr);}
.lib-side{background:var(--side);border-right:1px solid var(--line);padding:10px 8px 20px;overflow-y:auto;max-height:680px;}
.lib-side-hd{display:flex;align-items:center;gap:6px;padding:2px 6px 10px;}
.lib-side-hd b{font-size:14px;flex:1;}
.lib-item{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:7px;font-size:12.5px;color:var(--ink2);cursor:pointer;user-select:none;}
.lib-item:hover{background:var(--side-hi);}
.lib-item.on{background:#e4efe9;color:var(--brand-d);font-weight:600;}
.lib-group{display:flex;align-items:center;gap:5px;padding:10px 9px 3px;font-size:11.5px;color:var(--ink3);}
.lib-group span.grow{flex:1;}
.lib-group .add{width:18px;height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink3);}
.lib-group .add:hover{background:var(--side-hi);color:var(--ink);}
.lib-file{display:flex;align-items:center;gap:7px;padding:5px 9px 5px 20px;border-radius:6px;font-size:12px;color:var(--ink2);cursor:pointer;}
.lib-file:hover{background:var(--side-hi);}
.lib-file .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lib-main{padding:14px 18px 24px;min-width:0;}
.lib-main-hd{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.lib-main-hd h2{font-size:19px;font-weight:700;flex:1;}
.lib-tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:12px;}
.lib-tab{padding:7px 2px 9px;font-size:12.5px;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;}
.lib-tab:hover{color:var(--ink);}
.lib-tab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--brand);}
.lib-tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
.lib-tbl th{text-align:left;padding:8px 10px;font-weight:500;color:var(--ink3);font-size:11.5px;border-bottom:1px solid var(--line);}
.lib-tbl td{padding:9px 10px;border-bottom:1px solid var(--line);color:var(--ink2);}
.lib-tbl tr:last-child td{border-bottom:none;}
.lib-tbl tbody tr{cursor:pointer;}
.lib-tbl tbody tr:hover td{background:var(--panel);}
.lib-tbl .nmcell{display:flex;align-items:center;gap:9px;min-width:0;}
.lib-tbl .nmcell .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);}
.lib-ico{width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:8px;font-weight:700;flex:none;letter-spacing:.2px;}
.lib-empty{padding:40px 0;text-align:center;color:var(--ink3);font-size:12.5px;}
/* ============ 创建专家（对话式） ============ */
.ce-wrap{background:linear-gradient(180deg,#eef6f1 0%,#ffffff 46%);border-radius:14px;padding:14px 16px 16px;}
.ce-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.ce-chip{font-size:12.5px;color:var(--ink2);background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;white-space:nowrap;}
.ce-chip:hover{border-color:var(--brand);color:var(--brand-d);}
.ce-box{background:#fff;border:1px solid var(--line2);border-radius:14px;padding:12px 14px 10px;box-shadow:0 2px 10px rgba(16,40,30,.06);}
.ce-input{font-size:13.5px;line-height:1.95;color:var(--ink);outline:none;min-height:58px;}
.ce-mtag{display:inline-flex;align-items:center;gap:5px;background:var(--side);border:1px solid var(--line);border-radius:7px;padding:2px 8px;font-size:12px;color:var(--ink2);margin-right:6px;vertical-align:2px;}
.ce-bar{display:flex;align-items:center;gap:8px;margin-top:8px;}
.ce-pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);cursor:pointer;padding:4px 8px;border-radius:8px;white-space:nowrap;}
.ce-pill:hover{background:var(--side);}
.ce-exp{display:inline-flex;align-items:center;gap:6px;background:var(--side);border-radius:999px;padding:3px 10px 3px 4px;font-size:12.5px;cursor:pointer;white-space:nowrap;}
.ce-exp .dot{width:18px;height:18px;border-radius:50%;color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;flex:none;}
.ce-send{width:32px;height:32px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}
.ce-send:hover{background:var(--brand-d);}
.ce-foot{display:flex;gap:8px;margin-top:10px;}
.ce-foot .ce-pill{border:1px solid var(--line);background:#fff;}
.ce-hint{font-size:11.5px;color:var(--ink3);margin-top:8px;padding-left:2px;}
/* ============ IAM 登录（复刻海尔消费金融 IAM 登录页） ============ */
.iam-wrap{display:grid;grid-template-columns:1.12fr .88fr;min-height:420px;border-radius:12px;overflow:hidden;border:1px solid var(--line);}
.iam-left{background:linear-gradient(135deg,#1b3a8f 0%,#1f4fd0 46%,#1596e8 100%);color:#fff;position:relative;padding:20px 22px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;}
.iam-left::after{content:"";position:absolute;right:-40px;bottom:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.10);}
.iam-brand{position:absolute;top:16px;left:22px;display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:700;letter-spacing:.5px;}
.iam-brand .dot{width:16px;height:16px;border-radius:50%;background:conic-gradient(#f97316,#ef4444,#f59e0b,#22c55e,#3b82f6,#f97316);}
.iam-slogan{font-size:32px;font-weight:800;line-height:1.3;letter-spacing:3px;text-shadow:0 6px 18px rgba(0,0,0,.30);}
.iam-slogan span{display:block;}
.iam-sub{font-size:11.5px;opacity:.78;margin-top:10px;letter-spacing:1px;}
.iam-right{background:#fff;padding:20px 24px;display:flex;flex-direction:column;justify-content:center;}
.iam-right h4{font-size:15px;text-align:center;margin-bottom:16px;font-weight:700;}
.iam-field{display:flex;align-items:center;gap:9px;margin-bottom:11px;font-size:12.5px;}
.iam-field label{width:72px;color:var(--ink3);text-align:right;flex:none;}
.iam-field input{flex:1;min-width:0;border:1px solid var(--line2);border-radius:6px;padding:7px 10px;font-size:12.5px;background:#f7f9fb;color:var(--ink);}
.iam-field input:focus{border-color:#2f7df6;background:#fff;}
.iam-cap{width:76px;height:30px;border:1px solid var(--line2);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:Consolas,monospace;font-size:14px;letter-spacing:3px;color:#2563eb;background:repeating-linear-gradient(45deg,#eef4fb,#eef4fb 5px,#e3edf9 5px,#e3edf9 10px);cursor:pointer;flex:none;user-select:none;}
.iam-btn{width:100%;background:#2f7df6;color:#fff;border-radius:6px;padding:9px;font-size:13px;font-weight:600;cursor:pointer;margin-top:8px;}
.iam-btn:hover{background:#1e6ae0;}
.iam-links{display:flex;justify-content:flex-end;margin-top:8px;font-size:11.5px;color:#2f7df6;cursor:pointer;}
.iam-demo{display:flex;align-items:center;gap:6px;margin-top:14px;font-size:11.5px;color:var(--ink3);cursor:pointer;padding-top:10px;border-top:1px dashed var(--line);}
.iam-demo .bx{width:14px;height:14px;border:1px solid var(--line3);border-radius:3px;display:flex;align-items:center;justify-content:center;flex:none;}
.iam-demo.on .bx{background:var(--brand);border-color:var(--brand);color:#fff;}
/* 本地产物视图 */
.lib-local{padding:14px 20px 40px;max-width:1400px;margin:0 auto;}
.lib-back{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);cursor:pointer;padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;margin-bottom:12px;}
.lib-back:hover{border-color:var(--brand);color:var(--brand-d);}
.lib-lbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.lib-ltbl{width:100%;border-collapse:collapse;font-size:12.5px;}
.lib-ltbl th{text-align:left;padding:9px 10px;font-size:11.5px;color:var(--ink3);font-weight:500;border-bottom:1px solid var(--line);}
.lib-ltbl th.sortable{cursor:pointer;white-space:nowrap;}
.lib-ltbl th .arr{color:var(--ink4);font-size:9px;margin-left:2px;}
.lib-grp-hd{display:flex;align-items:center;gap:7px;padding:11px 2px 7px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink);border-bottom:1px solid var(--line);}
.lib-grp-hd .cnt{font-weight:400;color:var(--ink3);font-size:11.5px;}
.lib-task-hd{display:flex;align-items:center;gap:7px;padding:9px 2px 7px 14px;font-size:12.5px;color:var(--ink2);}
.lib-task-hd b{font-weight:600;color:var(--ink);}
.lib-lrow td{padding:8px 10px;border-bottom:1px solid var(--line);color:var(--ink2);vertical-align:middle;}
.lib-lrow:hover td{background:var(--panel);}
.lib-lrow .nmc{display:flex;align-items:center;gap:8px;min-width:0;padding-left:30px;}
.lib-lrow .nmc .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);}
.lib-lrow .ck{opacity:0;width:14px;flex:none;color:var(--ink3);cursor:pointer;}
.lib-lrow:hover .ck{opacity:1;}
.lib-lrow .rowacts{opacity:0;color:var(--ink3);cursor:pointer;padding:1px 5px;border-radius:5px;flex:none;}
.lib-lrow:hover .rowacts{opacity:1;background:var(--side-hi);}
.lib-lrow .star{color:#d99b2b;flex:none;font-size:11px;}
.lib-starline{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);cursor:pointer;user-select:none;}
.lib-starline .bx{width:15px;height:15px;border:1px solid var(--line3);border-radius:4px;display:flex;align-items:center;justify-content:center;background:#fff;}
.lib-starline.on .bx{background:var(--brand);border-color:var(--brand);color:#fff;}

function fmtBytes(n){ return n; }
function fileKind(name){
  const e=(name.split('.').pop()||'').toLowerCase();
  if(['xlsx','xls'].includes(e)) return 'xlsx';
  if(['csv'].includes(e)) return 'csv';
  if(['docx','doc'].includes(e)) return 'docx';
  if(['pptx','ppt'].includes(e)) return 'pptx';
  if(['pdf'].includes(e)) return 'pdf';
  if(['html','htm'].includes(e)) return 'html';
  if(['png','jpg','jpeg','webp'].includes(e)) return 'img';
  if(['md','markdown'].includes(e)) return 'md';
  if(['yaml','yml'].includes(e)) return 'yaml';
  return 'doc';
}

function showPop(anchorEl, html, opts){
  closePop();
  closePop2();
  const p=document.createElement('div'); p.className='pop'; p.innerHTML=html;
  document.body.appendChild(p);
  const r=anchorEl.getBoundingClientRect();
  const pw=p.offsetWidth, ph=p.offsetHeight;
  let left = opts && opts.align==='right' ? r.right-pw : r.left;
  let top = opts && opts.below ? r.bottom+6 : r.top-ph-6;
  if(left+pw>window.innerWidth-10) left=window.innerWidth-pw-10;
  if(left<10) left=10;
  if(top<10) top=r.bottom+6;
  if(top+ph>window.innerHeight-10) top=Math.max(10,window.innerHeight-ph-10);
  p.style.left=left+'px'; p.style.top=top+'px';
  openPop=p; return p;
}

function navEntries(){

function renderNav(){
  const {primary, more}=navEntries();
  let h='';
  primary.forEach(id=>{
    const d=NAV_DEFS[id]; if(!d) return;
    h+='<button class="nav-item'+(S.view===d.view?' on':'')+'" data-nav="'+id+'"><span class="ic">'+ic(d.icon,'','17')+'</span><span class="lbl">'+esc(d.label)+'</span>'+(d.tag?'<span class="tag">'+d.tag+'</span>':'')+'</button>';
  });
  if(more.length){
    h+='<button class="nav-item'+(S.view==='more'?' on':'')+'" data-nav="more"><span class="ic">'+ic('dots','','17')+'</span><span class="lbl">更多</span></button>';
  }
  // 任务分组（支持按空间过滤；筛选「已归档」时仅显示归档任务，且不受空间分组限制）
  const sfSpace=S.spaces.find(v=>v.id===S.spaceFilter);
  const list=S.tasks.filter(t=>{
    if(S.filters.status==='archived'){ return t.status==='archived' && matchFilter(t); }
    if(t.status==='archived') return false;
    return (S.spaceFilter ? t.space===S.spaceFilter : !t.space) && matchFilter(t);
  });
  h+='<div class="nav-group-lbl"><span>'+(sfSpace?'任务 · '+esc(sfSpace.name):'任务')+' ('+list.length+')</span>'
    +(sfSpace?'<span class="cnt" data-act="clear-space-filter" title="清除空间过滤">'+ic('x','','13')+'</span>':'')
    +'<span class="cnt" data-act="open-filter">'+ic('filter','','13')+'</span></div>';
  const shown=S.showAllTasks?list:list.slice(0,6);
  shown.forEach(t=>{
    h+='<div class="nav-task'+(S.activeTask===t.id?' on':'')+'" data-task="'+t.id+'">'
      + '<span class="st-dot '+(STATUS_META[t.status]&&STATUS_META[t.status].c)+'"></span>'
      + '<span class="tt">'+esc(t.title)+'</span><span class="tm">'+esc(t.time)+'</span></div>';
  });
  if(list.length>6) h+='<div class="nav-task" data-act="toggle-all-tasks"><span class="st-dot" style="background:transparent"></span><span class="tt" style="color:var(--ink3)">'+(S.showAllTasks?'收起':'查看更多')+'</span></div>';
  // 空间分组
  h+='<div class="nav-group-lbl"><span>空间 ('+S.spaces.length+')</span></div>';
  S.spaces.forEach(sp=>{
    const st=aggStatus(sp.tasks);
    h+='<div class="nav-space" data-space="'+sp.id+'"><span class="st-dot '+(st?(STATUS_META[st].c):'')+'"></span><span class="tt">'+esc(sp.name)+'</span><span class="tm">'+sp.count+'</span></div>';
  });
  el('navScroll').innerHTML=h;
}
function aggStatus(taskIds){
  const set=new Set(taskIds);
  for(const p of PRIORITY){ if(S.tasks.some(t=>set.has(t.id)&&t.status===p)) return p; }
  return null;
}
function matchFilter(t){
  const f=S.filters;
  if(f.status!=='all' && t.status!==f.status) return false;
  if(f.date==='today' && !/刚刚|今天/.test(t.time)) return false;
  if(f.date==='week' && /(9月|10月1[0-9]日|9月2)/.test(t.time)) return false;
  return true;
}

async function typeHtml(node, html){
  // 简易流式：按标签分片输出
  const tokens=html.split(/(<[^>]+>)/).filter(x=>x!=='');
  let buf='';
  for(const tk of tokens){
    if(tk.startsWith('<')){ buf+=tk; node.innerHTML=buf; }
    else{
      for(let i=0;i<tk.length;i+=2){
        buf+=tk[i]; node.innerHTML=buf; scrollBottom(); await sleep(9);
        if(tk[i+1]){ buf+=tk[i+1]; node.innerHTML=buf; }
      }
    }
    await sleep(4);
  }
}

/* 资料库：按当前节点/标签/类型/关键词过滤 */
function libNodeTitle(){
  const L=S.lib;
  if(L.node.indexOf('col:')===0){ const c=L.cols.find(v=>v.id===L.node.slice(4)); return c?c.name:'文件夹'; }
  return LIB_NODES[L.node]||'最近';
}
function libFiltered(){
  const L=S.lib;
  return LIBRARY.filter(x=>{
    if(L.node.indexOf('col:')===0){ if(x.col!==L.node.slice(4)) return false; }
    else{
      if(L.node==='local'&&x.section!=='local') return false;
      if(L.node==='my'&&x.section!=='my') return false;
      if(L.node==='team'&&x.section!=='team') return false;
    }
    if(L.tab==='mine'&&!x.byMe) return false;
    if(L.tab==='shared'&&!x.byOthers) return false;
    if(L.type!=='all'&&x.kind!==L.type) return false;
    if(L.q && x.title.toLowerCase().indexOf(L.q.toLowerCase())<0) return false;
    return true;
  });
}

function renderLocalArtifacts(){

  let rows='', total=0;
  LOCAL_TASKS.forEach((g,gi)=>{

    const open=L.groups[key]!==false;
    const files0=g.files.filter(f=>{
      if(L.localType!=='all'&&localKindGroup(f.k)!==L.localType) return false;
      if(L.starOnly&&!f.star) return false;
      if(L.localQ&&f.n.toLowerCase().indexOf(L.localQ.toLowerCase())<0) return false;
      return true;
    });
    const S2=L.sort||{k:null,dir:1};

/* ---------- 12.2 二级浮层 ---------- */
let openPop2=null;
function closePop2(){ if(openPop2){openPop2.remove();openPop2=null;} }
document.addEventListener('mousedown', e=>{
  if(openPop2 && !openPop2.contains(e.target) && !e.target.closest('[data-sub]')) closePop2();
});
function showSubPop(anchorEl, html){
  closePop2();
  const p=document.createElement('div'); p.className='pop'; p.innerHTML=html;
  document.body.appendChild(p);
  const r=anchorEl.getBoundingClientRect();
  p.style.left=(r.right+6)+'px'; p.style.top=r.top+'px';
  if(p.offsetLeft+p.offsetWidth>window.innerWidth-10) p.style.left=Math.max(10,r.left-p.offsetWidth-6);
  if(p.offsetTop+p.offsetHeight>window.innerHeight-10) p.style.top=Math.max(10,window.innerHeight-p.offsetHeight-10);
  openPop2=p; return p;
}

const SEARCH_SCOPES=[{id:'all',label:'全部'},{id:'task',label:'任务'},{id:'space',label:'空间'},{id:'art',label:'产物'},{id:'lib',label:'资料库'}];
let searchScope='all';
const ARTIFACTS=[
  {n:'M2+客群催收策略建议表.xlsx',s:'486 KB'},{n:'催收话术合规清单.docx',s:'128 KB'},
  {n:'账龄分布与区域回收率.png',s:'96 KB'},{n:'回收率汇总.csv',s:'34 KB'},
  {n:'2026Q1经营分析报告.pptx',s:'9.4 MB'},{n:'策略规则库.yaml',s:'18 KB'}
];
function openSearch(){
  el('searchWrap').classList.add('on');
  searchScope='all';
  const i=el('searchInput'); i.value=''; renderSearchRes('');
  setTimeout(()=>i.focus(),30);
}
function closeSearch(){ el('searchWrap').classList.remove('on'); }
function hl(t,q){
  const s=esc(t);
  if(!q) return s;
  const safe=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return s.replace(new RegExp(safe,'ig'), m=>'<mark>'+m+'</mark>');
}
function renderSearchRes(q){
  q=(q||'').trim();
  const ql=q.toLowerCase();
  el('searchScope').innerHTML=SEARCH_SCOPES.map(s=>'<span class="sscope'+(searchScope===s.id?' on':'')+'" data-scope="'+s.id+'">'+s.label+'</span>').join('');
  const box=el('searchRes');
  const tasks=S.tasks.filter(t=>!ql||t.title.toLowerCase().indexOf(ql)>=0);
  const spaces=S.spaces.filter(s=>!ql||s.name.toLowerCase().indexOf(ql)>=0);
  const arts=ARTIFACTS.filter(a=>!ql||a.n.toLowerCase().indexOf(ql)>=0);
  const libs=LIBRARY.filter(l=>!ql||l.title.toLowerCase().indexOf(ql)>=0||(l.tags||[]).join('').toLowerCase().indexOf(ql)>=0);
  let h='';
  // 官方规则：未输入关键词时，「全部」页展示最近浏览记录
  if(!q && searchScope==='all'){
    box.innerHTML='<div class="sr-group">最近浏览</div>'+S.tasks.slice(0,6).map(t=>
      '<div class="sr-item" data-act="goto-task" data-id="'+t.id+'"><span class="ic">'+ic('clock','','14')+'</span>'
      +'<span class="meta"><b>'+esc(t.title)+'</b><span>最近访问 · '+esc(t.time)+'</span></span></div>').join('');
    return;
  }
  const show=k=>searchScope==='all'||searchScope===k;
  if(show('task')&&tasks.length){
    h+='<div class="sr-group">任务 ('+tasks.length+')</div>';
    tasks.slice(0,6).forEach(t=>{
      h+='<div class="sr-item" data-act="goto-task" data-id="'+t.id+'"><span class="ic">'+ic('bot','','14')+'</span>'
        +'<span class="meta"><b>'+hl(t.title,q)+'</b><span>'+esc(t.ws)+' · '+esc(t.time)+'</span></span></div>';
    });
  }
  if(show('space')&&spaces.length){
    h+='<div class="sr-group">空间 ('+spaces.length+')</div>';
    spaces.forEach(s=>{
      h+='<div class="sr-item" data-act="goto-space" data-id="'+s.id+'"><span class="ic">'+ic('folder','','14')+'</span>'
        +'<span class="meta"><b>'+hl(s.name,q)+'</b><span>'+s.count+' 个任务</span></span></div>';
    });
  }
  if(show('art')&&arts.length){
    h+='<div class="sr-group">产物 ('+arts.length+')</div>';
    arts.forEach(a=>{
      h+='<div class="sr-item" data-act="open-artifact" data-name="'+esc(a.n)+'"><span class="ic">'+ic('file','','14')+'</span>'
        +'<span class="meta"><b>'+hl(a.n,q)+'</b><span>'+esc(a.s)+'</span></span></div>';
    });
  }
  if(show('lib')&&libs.length){
    h+='<div class="sr-group">资料库 ('+libs.length+')</div>';
    libs.forEach(l=>{
      h+='<div class="sr-item" data-act="lib-open" data-id="'+l.id+'"><span class="ic">'+ic('book','','14')+'</span>'
        +'<span class="meta"><b>'+hl(l.title,q)+'</b><span>'+esc(l.owner)+' · '+esc(l.time)+'</span></span></div>';
    });
  }
  if(!h){
    h = q ? '<div class="rp-empty">'+ic('search','','30')+'没有找到相关结果</div>'
          : '<div class="sr-group">最近浏览</div>'+S.tasks.slice(0,4).map(t=>
        '<div class="sr-item" data-act="goto-task" data-id="'+t.id+'"><span class="ic">'+ic('clock','','14')+'</span>'
        +'<span class="meta"><b>'+esc(t.title)+'</b><span>最近访问 · '+esc(t.time)+'</span></span></div>').join('');
  }
  box.innerHTML=h;
}
/* 搜索结果键盘导航（↑↓ 选择 / Enter 打开） */
function searchMove(dir){
  const items=$$('.search-res .sr-item');
  if(!items.length) return;
  let idx=items.indexOf(document.querySelector('.search-res .sr-item.sel'));
  idx = idx<0 ? (dir>0?0:items.length-1) : Math.min(items.length-1, Math.max(0, idx+dir));
  items.forEach(x=>x.classList.remove('sel'));
  items[idx].classList.add('sel');
  items[idx].scrollIntoView({block:'nearest'});
}
function searchOpen(){
  const sel=document.querySelector('.search-res .sr-item.sel') || document.querySelector('.search-res .sr-item');
  if(sel) sel.click();
}

  if(id==='new'||id==='more') return;
  S.navMore=S.navMore.filter(x=>x!==id);
  S.navOrder=S.navOrder.filter(x=>x!==id);
  if(group==='mor'){ S.navMore.push(id); S.navOrder.push(id); }
  else{

document.addEventListener('dragover', e=>{

  e.preventDefault();
  let id=''; try{ id=e.dataTransfer.getData('text/plain'); }catch(err){}

function renderSetBody(){
  const body=el('setBody'); if(!body) return;
  const qt=(S.setQuery||'').trim();
  body.innerHTML = qt
    ? SET_TABS.map(t=>'<div class="set-sec" data-sec="'+t.id+'"><h4>'+t.label+'</h4>'+setSecRows(t.id)+'</div>').join('')
    : '<div class="set-sec">'+setSecRows(S.settingsTab)+'</div>';
  if(qt){
    body.querySelectorAll('.set-sec').forEach(sec=>{
      let n=0;
      sec.querySelectorAll('.set-row,.kv').forEach(r=>{
        const hit=r.innerText.toLowerCase().indexOf(qt.toLowerCase())>=0;
        r.style.display=hit?'':'none'; if(hit) n++;
      });
      sec.style.display=n?'':'none';
    });
  }
}

function iamDoLogin(){

  const p=((el('iamPass')||{}).value||'').trim();

  if(!u){ toast('请输入姓名拼音','err'); return; }

  if(code!==String(S.auth.captcha).toLowerCase()){ toast('验证码不正确','err'); return; }
  if(!otp){ toast('请输入二次认证码','err'); return; }
  S.auth.loggedIn=true;
  S.auth.user=u;
  S.auth.ticket='IAM-'+Date.now().toString(36).toUpperCase();
  if(S.auth.noModel){
    S.auth.models=[];
    S.auth.gwUrl=gwApplyUrl();
    gwApplyModal();

    S.auth.models=GW_MODELS.slice();

}

const PASTE_STORE=[];

/* ---------- 14.1 发送与流程 ---------- */
function currentWhich(){ return S.view==='home'?'home':'chat'; }
function doSend(){
  const which=currentWhich();
  const text=getInputText(which);
  if(!text){ toast('请输入任务描述','err'); return; }
  if(S.history[S.history.length-1]!==text){ S.history.push(text); if(S.history.length>20) S.history.shift(); }
  S.histIdx=-1;
  if(which==='home'){
    setInputText('home','');
    startTask(text);
  }else{
    setInputText('chat','');
    const inner=el('chatInner');
    const b=document.createElement('div'); b.className='msg-user'; b.textContent=text;
    inner.appendChild(b); scrollBottom();
    runAgent(text, S.activeTask);
  }
}
function runScript(script, taskId){
  const inner=el('chatInner');
  const t0=Date.now();
  return (async ()=>{
    for(const step of script){ await execStep(step, inner); }
    const secs=((Date.now()-t0)/1000).toFixed(1);
    const last=inner.querySelector('.msg-ai:last-child [data-t]');
    if(last) last.textContent='用时 '+secs+'s';
    if(taskId) updateTaskStatus(taskId);
    return secs;
  })();
}
async function execStep(step, inner){
  if(step.type==='think'){
    const box=document.createElement('div'); box.className='msg-ai';
    box.innerHTML='<div class="think-box"><div class="think-hd">'+ic('bulb','','14')+'<b>思考过程</b><span class="grow"></span><span class="st">'+ic('right','sp','13')+'</span></div><div class="think-bd">'+esc(step.body)+'</div></div>';
    inner.appendChild(box);
    box.querySelector('.think-hd').onclick=()=>box.querySelector('.think-box').classList.toggle('open');
    scrollBottom(); await sleep(420);
  }else if(step.type==='tool'){
    const box=document.createElement('div'); box.className='msg-ai';
    box.innerHTML='<div class="tool-card"><div class="tool-hd"><span class="ic">'+ic('terminal','','15')+'</span><span class="nm">'+esc(step.name)+'</span><span class="st">'+esc(step.status)+'</span><span class="grow"></span><span class="sp">'+ic('right','','13')+'</span></div><div class="tool-bd">'+esc(step.detail)+'<div class="mono">'+esc(step.code)+'</div></div></div>';
    inner.appendChild(box);
    box.querySelector('.tool-hd').onclick=()=>box.querySelector('.tool-card').classList.toggle('open');
    scrollBottom(); await sleep(560);
  }else if(step.type==='ask'){
    const box=document.createElement('div'); box.className='msg-ai';
    box.innerHTML='<div class="plan-panel"><div class="plan-hd">'+ic('bulb','','14')+'需要你确认</div><div class="plan-bd">'+esc(step.question)+'<ul style="margin:6px 0 0 18px">'+step.items.map(i=>'<li>'+esc(i)+'</li>').join('')+'</ul></div></div>';
    inner.appendChild(box); scrollBottom(); await sleep(600);
  }else if(step.type==='plan'){
    const box=document.createElement('div'); box.className='msg-ai';
    box.innerHTML='<div class="plan-panel"><div class="plan-hd">'+ic('doc','','14')+esc(step.title)+'</div><div class="plan-bd"><ol>'+step.steps.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol></div><div class="plan-acts"><button class="btn brand" data-act="plan-go">开始执行</button><button class="btn" data-act="plan-adjust">调整计划</button></div></div>';
    inner.appendChild(box); scrollBottom(); await sleep(300);
  }else if(step.type==='note'){
    const box=document.createElement('div'); box.className='msg-ai';
    box.innerHTML='<div class="ai-body" style="color:var(--ink2)">'+esc(step.text)+'</div>';
    inner.appendChild(box); scrollBottom(); await sleep(200);
  }else if(step.type==='text'){
    const box=document.createElement('div'); box.className='msg-ai';
    box.innerHTML='<div class="ai-head"><span class="ai-av">灵</span><span class="ai-name">灵犀</span><span class="ai-time" data-t>运行中…</span></div><div class="ai-body"></div>';
    inner.appendChild(box);
    const body=box.querySelector('.ai-body');
    const html=esc(step.text).replace(/\*\*(.+?)\*\*/g,'<span class="hl">$1</span>');
    await typeHtml(body, html);
    scrollBottom(); await sleep(200);
  }else if(step.type==='artifact'){
    const box=document.createElement('div'); box.className='msg-ai';
    box.innerHTML=artCard(step.name,step.size,step.kind);
    inner.appendChild(box); scrollBottom(); await sleep(260);
  }
}
async function startTask(text){
  const id='t'+Date.now();
  const t={id, title:text.slice(0,22)||'新任务', status:'running', time:'刚刚', ws:S.workspace, kind:'normal', first:text};
  S.tasks.unshift(t); S.activeTask=id;
  setView('chat', {title:t.title});
  const inner=el('chatInner');
  inner.innerHTML='<div class="msg-user">'+esc(text)+'</div>';
  const script=S.mode==='plan'?SCRIPT.plan:S.mode==='ask'?SCRIPT.ask:SCRIPT.agent;
  await runScript(script, id);
  if(S.perm==='default' && S.mode==='agent'){ await sleep(300); showPermConfirm(inner); }
}

/* ---------- 14.4 键盘 ---------- */
document.addEventListener('keydown', async e=>{
  if(e.key==='Escape'){
    if(el('modalMask').style.display==='flex'){ hideModal(); return; }
    if(el('searchWrap').classList.contains('on')){ closeSearch(); return; }
    closePop(); closePop2(); return;
  }
  // 全局搜索快捷键：Ctrl/Cmd + K（官方：搜索快捷键）
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openSearch(); return; }
  // 搜索面板内：↑↓ 选择 / Enter 打开
  if(el('searchWrap').classList.contains('on')){
    if(e.key==='ArrowDown'){ e.preventDefault(); searchMove(1); return; }
    if(e.key==='ArrowUp'){ e.preventDefault(); searchMove(-1); return; }
    if(e.key==='Enter'){ e.preventDefault(); searchOpen(); return; }
  }
  const tag=(e.target.tagName||'').toLowerCase();
  const inComposer=e.target.closest && e.target.closest('.cm-text');
  if(inComposer){
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); doSend(); return; }
    if(e.key==='ArrowUp' && S.history.length){
      if(inComposer.innerText.trim()==='' || window.getSelection().anchorOffset===0){
        e.preventDefault();
        S.histIdx=S.histIdx<0?S.history.length-1:Math.max(0,S.histIdx-1);
        inComposer.innerText=S.history[S.histIdx];
        placeCaretEnd(inComposer);
        return;
      }
    }
    if(e.key==='ArrowDown' && S.history.length && S.histIdx>=0){
      e.preventDefault();
      S.histIdx++;
      if(S.histIdx>=S.history.length){ S.histIdx=-1; inComposer.innerText=''; }
      else { inComposer.innerText=S.history[S.histIdx]; placeCaretEnd(inComposer); }
      return;
    }
  }
  if(tag==='input'||tag==='textarea') return;
});
function placeCaretEnd(node){
  const r=document.createRange(); r.selectNodeContents(node); r.collapse(false);
  const s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
}
document.addEventListener('input', e=>{
  const n=e.target;
  if(n.id==='searchInput'){ renderSearchRes(n.value); return; }
  if(n.id==='setSearch'){ S.setQuery=n.value; renderSetBody(); return; }
  if(n.id==='libSearchInput'){ S.lib.q=n.value; libRefreshRows(); return; }
  if(n.id==='ceInput'){
    const clone=n.cloneNode(true);
    const tag=clone.querySelector('.ce-mtag'); if(tag) tag.remove();
    S.ce.text=clone.innerText.trim();
    return;
  }
  if(n.id==='libLocalSearch'){
    S.lib.localQ=n.value;
    renderLibrary();
    const ni=document.querySelector('#libLocalSearch');
    if(ni){ ni.focus(); ni.setSelectionRange(ni.value.length,ni.value.length); }
    return;
  }
  if(n.closest && n.closest('.cm-text')){
    const txt=n.innerText||'';
    if(txt.indexOf('/')===0){
      const q=txt.slice(1).split(/\s/)[0].toLowerCase();
      const list=COMMANDS.filter(c=>c.name.toLowerCase().indexOf(q)>=0).slice(0,6);
      if(list.length){
        const anchor=n.closest('.composer');
        showPop(anchor,'<div class="pop-label">斜杠指令</div>'+list.map(c=>'<div class="pop-item" data-act="use-cmd" data-cmd="'+esc(c.name)+'">'+ic('terminal','','16')+'<span class="grow"><b style="font-weight:500">/'+esc(c.name)+'</b> <span class="sub">'+esc(c.desc)+'</span></span></div>').join(''), {below:true});
        return;
      }
    }
  }
});

/* ---------- 14.5 超长粘贴收起 ---------- */
document.addEventListener('paste', e=>{
  const n=e.target;
  if(!n.closest || !n.closest('.cm-text')) return;
  const txt=(e.clipboardData||window.clipboardData).getData('text')||'';
  if(txt.length<=3000) return;
  e.preventDefault();
  PASTE_STORE.push(txt);
  const idx=PASTE_STORE.length-1;
  const node=document.createElement('div');
  node.className='collapsed-paste';
  node.dataset.paste=idx;
  node.innerHTML=ic('doc','','13')+'<span class="txt">已折叠长文本（'+txt.length.toLocaleString()+' 字符）</span><span class="badge">点击展开</span>';
  node.onclick=()=>{
    const full=PASTE_STORE[parseInt(node.dataset.paste,10)]||'';
    const span=document.createElement('div');
    span.style.whiteSpace='pre-wrap'; span.style.fontSize='12.5px'; span.style.color='var(--ink2)';
    span.style.marginTop='6px'; span.style.maxHeight='180px'; span.style.overflow='auto';
    span.textContent=full;
    node.replaceWith(span);
  };
  n.appendChild(node);
  toast('长文本已折叠，点击可展开','ok');
});

/* ---------- 14.6 拖拽文件 ---------- */
let dragDepth=0;
window.addEventListener('dragenter', e=>{ e.preventDefault(); dragDepth++; el('dropzone').classList.add('on'); });
window.addEventListener('dragover', e=>{ e.preventDefault(); });
window.addEventListener('dragleave', e=>{ e.preventDefault(); dragDepth=Math.max(0,dragDepth-1); if(!dragDepth) el('dropzone').classList.remove('on'); });
window.addEventListener('drop', e=>{
  e.preventDefault(); dragDepth=0; el('dropzone').classList.remove('on');
  if(e.target.closest && e.target.closest('[data-navdrag]')) return;
  const files=e.dataTransfer && e.dataTransfer.files;
  if(!files || !files.length) return;
  const w=currentWhich();
  const arr=S.attachments[w]||(S.attachments[w]=[]);
  let added=0;
  for(const f of files){ if(arr.length>=50) break; arr.push({name:f.name}); added++; }
  renderAttach(w);
  toast('已添加 '+added+' 个文件'+(arr.length>=50?'（上限 50 个）':''),'ok');
});

/* ---------- 14.7 初始化 ---------- */
function boot(){
  el('searchIcon').innerHTML=ic('search','','17');
  const d=document.querySelector('.nav-top .btn-ghost .ic'); if(d) d.innerHTML=ic('grid','','14');
  const nc=document.querySelector('.nav-foot .ic-btn[data-act="nav-custom"]'); if(nc) nc.innerHTML=ic('dots','','15');
  const f=document.querySelector('.nav-foot .ic-btn[data-act="messages"]'); if(f) f.innerHTML=ic('bell','','15');
  const dv=document.querySelector('.nav-foot .ic-btn[data-act="devices"]'); if(dv) dv.innerHTML=ic('phone','','15');
  const st=document.querySelector('.nav-foot .ic-btn[data-act="settings"]'); if(st) st.innerHTML=ic('gear','','15');
  $$('.topbar .tbtn .ic').forEach((n,i)=>{ n.innerHTML=ic(['search','filter','layers','grid2'][i]||'file','','14'); });
  renderNav();
  setView('home');
  renderRp();
  /* 每次打开页面：直接弹出 IAM 登录 → 拉取 AI 网关授权模型 */
  S.auth.loggedIn=false; S.auth.user=''; S.auth.ticket=''; S.auth.models=[]; S.auth.noModel=false;
  setTimeout(()=>iamLoginModal(), 500);
}
boot();
